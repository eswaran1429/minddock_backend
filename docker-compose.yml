version: "3.9"

services:
  api:
    build: .
    container_name: minddock-backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - postgres


  postgres:
    image: postgres:17
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
